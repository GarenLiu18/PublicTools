<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SequanceChecker</title>

<style>
    * {
        box-sizing: border-box;
    }

    :root {
        --preview-scale: 1;
    }

    body {
        margin: 0;
        padding: 24px;
        background: #181818;
        color: #eee;
        font-family: Arial, sans-serif;
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
    }

    h2 {
        margin: 0;
        font-size: 28px;
    }

    .scale-control {
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
        color: #bbb;
        font-size: 13px;
    }

    .scale-control input {
        width: 160px;
    }

    #scaleValue {
        width: 45px;
        text-align: right;
        color: #eee;
    }

    .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
        flex-wrap: wrap;
    }

    button {
        padding: 10px 18px;
        border: 0;
        border-radius: 6px;
        background: #3b82f6;
        color: white;
        cursor: pointer;
        font-size: 14px;
    }

    button:hover {
        background: #2563eb;
    }

    button.secondary {
        background: #444;
    }

    button.secondary:hover {
        background: #555;
    }

    #status {
        color: #aaa;
        font-size: 14px;
    }

    .folder {
        margin-bottom: 8px;
    }

    .folder > summary {
        cursor: pointer;
        user-select: none;
        padding: 10px 12px;
        background: #242424;
        border: 1px solid #333;
        border-radius: 6px;
        font-weight: bold;
    }

    .folder > summary:hover {
        background: #2d2d2d;
    }

    .folder-content {
        margin-left: 20px;
        padding-top: 8px;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
        margin: 8px 0 16px 0;
    }

    .card {
        background: #242424;
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        transition: border-color 0.15s, transform 0.15s;
    }

    .card:hover {
        border-color: #3b82f6;
        transform: translateY(-2px);
    }

    .preview {
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;

        background:
            linear-gradient(45deg, #222 25%, transparent 25%),
            linear-gradient(-45deg, #222 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #222 75%),
            linear-gradient(-45deg, transparent 75%, #222 75%);

        background-size: 20px 20px;

        background-position:
            0 0,
            0 10px,
            10px -10px,
            -10px 0;
    }

    .preview img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;

        transform: scale(var(--preview-scale));
        transform-origin: center;
    }

    .info {
        padding: 10px;
    }

    .name {
        font-weight: bold;
        margin-bottom: 5px;
        word-break: break-all;
    }

    .path {
        color: #888;
        font-size: 11px;
        word-break: break-all;
    }

    .frame-count {
        margin-top: 5px;
        color: #666;
        font-size: 11px;
    }

    #toast {
        position: fixed;
        left: 50%;
        bottom: 30px;

        transform:
            translateX(-50%)
            translateY(20px);

        background: #111;
        border: 1px solid #444;

        padding: 10px 18px;
        border-radius: 6px;

        opacity: 0;
        pointer-events: none;

        transition: 0.2s;
        z-index: 999;
    }

    #toast.show {
        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0);
    }
</style>
</head>

<body>

<div class="header">

    <h2>SequanceChecker</h2>

    <div class="scale-control">
        <span>圖片大小</span>

        <input
            id="scaleSlider"
            type="range"
            min="25"
            max="300"
            value="100"
            step="5"
        >

        <span id="scaleValue">
            100%
        </span>
    </div>

</div>


<div class="toolbar">

    <button id="selectFolder">
        選擇資料夾
    </button>

    <button
        id="grantPermissionButton"
        class="secondary"
        style="display:none;"
    >
        重新授權
    </button>

    <span id="status">
        尚未選擇資料夾
    </span>

</div>


<div id="root"></div>

<div id="toast"></div>


<script>

const FPS = 12;

const DB_NAME =
    "SequanceChecker";

const STORE_NAME =
    "handles";

const HANDLE_KEY =
    "rootDirectory";


const selectFolderButton =
    document.getElementById(
        "selectFolder"
    );

const grantPermissionButton =
    document.getElementById(
        "grantPermissionButton"
    );

const rootElement =
    document.getElementById(
        "root"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const toastElement =
    document.getElementById(
        "toast"
    );

const scaleSlider =
    document.getElementById(
        "scaleSlider"
    );

const scaleValue =
    document.getElementById(
        "scaleValue"
    );


let currentRootHandle = null;

let toastTimer = null;



/* =========================
   Preview Scale
========================= */

scaleSlider.addEventListener(
    "input",
    () => {

        const value =
            Number(
                scaleSlider.value
            );

        scaleValue.textContent =
            `${value}%`;

        document.documentElement.style.setProperty(
            "--preview-scale",
            value / 100
        );
    }
);



/* =========================
   啟動
========================= */

window.addEventListener(
    "load",
    async () => {

        try {

            const savedHandle =
                await loadDirectoryHandle();

            if (!savedHandle) {
                return;
            }


            currentRootHandle =
                savedHandle;


            const permission =
                await savedHandle.queryPermission({
                    mode: "read"
                });


            if (
                permission ===
                "granted"
            ) {

                await loadFolder(
                    savedHandle
                );

                return;
            }


            statusElement.textContent =
                `已記住資料夾：${savedHandle.name}`;


            grantPermissionButton.style.display =
                "inline-block";

        } catch (error) {

            console.error(
                error
            );
        }
    }
);



/* =========================
   選擇資料夾
========================= */

selectFolderButton.addEventListener(
    "click",
    async () => {

        try {

            const rootHandle =
                await window.showDirectoryPicker({
                    mode: "read"
                });


            currentRootHandle =
                rootHandle;


            await saveDirectoryHandle(
                rootHandle
            );


            grantPermissionButton.style.display =
                "none";


            await loadFolder(
                rootHandle
            );

        } catch (error) {

            if (
                error.name !==
                "AbortError"
            ) {

                console.error(
                    error
                );

                statusElement.textContent =
                    "讀取資料夾失敗";
            }
        }
    }
);



/* =========================
   重新授權
========================= */

grantPermissionButton.addEventListener(
    "click",
    async () => {

        if (!currentRootHandle) {
            return;
        }


        try {

            const permission =
                await currentRootHandle.requestPermission({
                    mode: "read"
                });


            if (
                permission !==
                "granted"
            ) {

                statusElement.textContent =
                    "未取得資料夾權限";

                return;
            }


            grantPermissionButton.style.display =
                "none";


            await loadFolder(
                currentRootHandle
            );

        } catch (error) {

            console.error(
                error
            );

            statusElement.textContent =
                "授權失敗";
        }
    }
);



/* =========================
   載入資料夾
========================= */

async function loadFolder(
    rootHandle
) {

    rootElement.innerHTML =
        "";


    statusElement.textContent =
        "掃描中...";


    const files = [];


    await scanDirectory(
        rootHandle,
        rootHandle.name,
        files
    );


    const groups =
        groupFiles(
            files
        );


    const tree =
        buildFolderTree(
            rootHandle.name,
            groups
        );


    renderFolder(
        tree,
        rootElement
    );


    statusElement.textContent =
        `${rootHandle.name} / ${groups.length} 個動畫`;
}



/* =========================
   掃描資料夾
========================= */

async function scanDirectory(
    directoryHandle,
    currentPath,
    result
) {

    for await (
        const [name, handle]
        of directoryHandle.entries()
    ) {

        const path =
            `${currentPath}/${name}`;


        if (
            handle.kind ===
            "directory"
        ) {

            await scanDirectory(
                handle,
                path,
                result
            );

            continue;
        }


        const extension =
            name
                .split(".")
                .pop()
                .toLowerCase();


        if (
            extension !== "png" &&
            extension !== "gif"
        ) {
            continue;
        }


        const file =
            await handle.getFile();


        result.push({
            name,
            path,
            directory:
                currentPath,
            extension,
            file
        });
    }
}



/* =========================
   Group Sequence
========================= */

function groupFiles(
    files
) {

    const map =
        new Map();


    for (
        const file
        of files
    ) {

        const parsed =
            parseFilename(
                file.name
            );


        if (
            file.extension ===
            "gif"
        ) {

            const key =
                `${file.directory}/${parsed.originalName}`;


            map.set(
                key,
                {
                    type:
                        "gif",

                    name:
                        parsed.originalName,

                    directory:
                        file.directory,

                    path:
                        `${file.directory}/${parsed.originalName}`,

                    files: [
                        file
                    ]
                }
            );

            continue;
        }


        const baseName =
            parsed.sequenceName;


        const key =
            `${file.directory}/${baseName}`;


        if (
            !map.has(
                key
            )
        ) {

            map.set(
                key,
                {
                    type:
                        "png",

                    name:
                        baseName,

                    directory:
                        file.directory,

                    path:
                        `${file.directory}/${baseName}`,

                    files:
                        []
                }
            );
        }


        map
            .get(key)
            .files
            .push({
                ...file,

                frame:
                    parsed.frame
            });
    }


    const groups =
        Array.from(
            map.values()
        );


    for (
        const group
        of groups
    ) {

        if (
            group.type !==
            "png"
        ) {
            continue;
        }


        group.files.sort(
            (a, b) => {

                if (
                    a.frame !== null &&
                    b.frame !== null
                ) {

                    return (
                        a.frame -
                        b.frame
                    );
                }


                return a.name.localeCompare(
                    b.name,
                    undefined,
                    {
                        numeric:
                            true
                    }
                );
            }
        );
    }


    groups.sort(
        (a, b) =>
            a.path.localeCompare(
                b.path,
                undefined,
                {
                    numeric:
                        true
                }
            )
    );


    return groups;
}



/* =========================
   Parse Filename
========================= */

function parseFilename(
    filename
) {

    const originalName =
        filename.replace(
            /\.[^.]+$/,
            ""
        );


    const match =
        originalName.match(
            /^(.*?)(?:_?)(\d+)$/
        );


    if (!match) {

        return {
            originalName,

            sequenceName:
                originalName,

            frame:
                null
        };
    }


    return {
        originalName,

        sequenceName:
            match[1],

        frame:
            Number(
                match[2]
            )
    };
}



/* =========================
   Folder Tree
========================= */

function buildFolderTree(
    rootName,
    groups
) {

    const tree = {

        name:
            rootName,

        folders:
            new Map(),

        groups:
            []
    };


    for (
        const group
        of groups
    ) {

        const parts =
            group.directory
                .split("/")
                .slice(1);


        let current =
            tree;


        for (
            const folderName
            of parts
        ) {

            if (
                !current.folders.has(
                    folderName
                )
            ) {

                current.folders.set(
                    folderName,
                    {
                        name:
                            folderName,

                        folders:
                            new Map(),

                        groups:
                            []
                    }
                );
            }


            current =
                current.folders.get(
                    folderName
                );
        }


        current.groups.push(
            group
        );
    }


    return tree;
}



/* =========================
   判斷是否可扁平化
========================= */

function isSingleSequenceFolder(
    node
) {

    return (
        node.groups.length === 1 &&
        node.folders.size === 0
    );
}



/* =========================
   Render Folder
   Lazy Render
========================= */

function renderFolder(
    node,
    parent
) {

    const details =
        document.createElement(
            "details"
        );


    details.className =
        "folder";


    const summary =
        document.createElement(
            "summary"
        );


    summary.textContent =
        `📁 ${node.name}`;


    details.appendChild(
        summary
    );


    const content =
        document.createElement(
            "div"
        );


    content.className =
        "folder-content";


    details.appendChild(
        content
    );


    let cleanupCallbacks =
        [];


    details.addEventListener(
        "toggle",
        () => {

            if (
                details.open
            ) {

                cleanupCallbacks =
                    renderFolderContent(
                        node,
                        content
                    );

            } else {

                for (
                    const cleanup
                    of cleanupCallbacks
                ) {

                    cleanup();
                }


                cleanupCallbacks =
                    [];


                content.innerHTML =
                    "";
            }
        }
    );


    parent.appendChild(
        details
    );
}



/* =========================
   Folder Content
========================= */

function renderFolderContent(
    node,
    content
) {

    const cleanupCallbacks =
        [];


    const directGroups =
        [
            ...node.groups
        ];


    const normalFolders =
        [];


    /*
        如果子資料夾只有一組 Sequence，
        不建立資料夾 UI，
        直接把動畫放在目前層級。
    */

    for (
        const folder
        of node.folders.values()
    ) {

        if (
            isSingleSequenceFolder(
                folder
            )
        ) {

            directGroups.push(
                folder.groups[0]
            );

        } else {

            normalFolders.push(
                folder
            );
        }
    }



    if (
        directGroups.length >
        0
    ) {

        const gallery =
            document.createElement(
                "div"
            );


        gallery.className =
            "gallery";


        directGroups.sort(
            (a, b) =>
                a.path.localeCompare(
                    b.path,
                    undefined,
                    {
                        numeric:
                            true
                    }
                )
        );


        for (
            const group
            of directGroups
        ) {

            const cleanup =
                renderCard(
                    group,
                    gallery
                );


            cleanupCallbacks.push(
                cleanup
            );
        }


        content.appendChild(
            gallery
        );
    }



    normalFolders.sort(
        (a, b) =>
            a.name.localeCompare(
                b.name,
                undefined,
                {
                    numeric:
                        true
                }
            )
    );


    for (
        const folder
        of normalFolders
    ) {

        renderFolder(
            folder,
            content
        );
    }


    return cleanupCallbacks;
}



/* =========================
   Render Card
========================= */

function renderCard(
    group,
    parent
) {

    const objectUrls =
        [];

    let timer =
        null;


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card";


    const preview =
        document.createElement(
            "div"
        );


    preview.className =
        "preview";


    const img =
        document.createElement(
            "img"
        );


    preview.appendChild(
        img
    );


    const info =
        document.createElement(
            "div"
        );


    info.className =
        "info";


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "name";


    name.textContent =
        group.name;


    const path =
        document.createElement(
            "div"
        );


    path.className =
        "path";


    path.textContent =
        group.path;


    const frameCount =
        document.createElement(
            "div"
        );


    frameCount.className =
        "frame-count";


    info.appendChild(
        name
    );

    info.appendChild(
        path
    );

    info.appendChild(
        frameCount
    );


    card.appendChild(
        preview
    );

    card.appendChild(
        info
    );


    parent.appendChild(
        card
    );


    card.addEventListener(
        "click",
        () =>
            copyPath(
                group.path
            )
    );



    if (
        group.type ===
        "gif"
    ) {

        const url =
            URL.createObjectURL(
                group.files[0].file
            );


        objectUrls.push(
            url
        );


        img.src =
            url;


        frameCount.textContent =
            "GIF";

    } else {

        const urls =
            group.files.map(
                item => {

                    const url =
                        URL.createObjectURL(
                            item.file
                        );


                    objectUrls.push(
                        url
                    );


                    return url;
                }
            );


        frameCount.textContent =
            `${urls.length} frames`;


        if (
            urls.length >
            0
        ) {

            img.src =
                urls[0];
        }


        if (
            urls.length >
            1
        ) {

            let frame =
                0;


            timer =
                setInterval(
                    () => {

                        frame =
                            (
                                frame + 1
                            ) %
                            urls.length;


                        img.src =
                            urls[frame];

                    },
                    1000 / FPS
                );
        }
    }



    return () => {

        if (
            timer !== null
        ) {

            clearInterval(
                timer
            );
        }


        for (
            const url
            of objectUrls
        ) {

            URL.revokeObjectURL(
                url
            );
        }
    };
}



/* =========================
   Copy Path
========================= */

async function copyPath(
    path
) {

    try {

        await navigator.clipboard
            .writeText(
                path
            );


        showToast(
            `已複製：${path}`
        );

    } catch {

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            path;


        document.body.appendChild(
            textarea
        );


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();


        showToast(
            `已複製：${path}`
        );
    }
}



/* =========================
   Toast
========================= */

function showToast(
    text
) {

    toastElement.textContent =
        text;


    toastElement.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toastElement.classList.remove(
                    "show"
                );

            },
            1500
        );
}



/* =========================
   IndexedDB
========================= */

function openDB() {

    return new Promise(
        (resolve, reject) => {

            const request =
                indexedDB.open(
                    DB_NAME,
                    1
                );


            request.onupgradeneeded =
                () => {

                    const db =
                        request.result;


                    if (
                        !db.objectStoreNames.contains(
                            STORE_NAME
                        )
                    ) {

                        db.createObjectStore(
                            STORE_NAME
                        );
                    }
                };


            request.onsuccess =
                () =>
                    resolve(
                        request.result
                    );


            request.onerror =
                () =>
                    reject(
                        request.error
                    );
        }
    );
}



async function saveDirectoryHandle(
    handle
) {

    const db =
        await openDB();


    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            transaction
                .objectStore(
                    STORE_NAME
                )
                .put(
                    handle,
                    HANDLE_KEY
                );


            transaction.oncomplete =
                resolve;


            transaction.onerror =
                () =>
                    reject(
                        transaction.error
                    );
        }
    );
}



async function loadDirectoryHandle() {

    const db =
        await openDB();


    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readonly"
                );


            const request =
                transaction
                    .objectStore(
                        STORE_NAME
                    )
                    .get(
                        HANDLE_KEY
                    );


            request.onsuccess =
                () =>
                    resolve(
                        request.result
                    );


            request.onerror =
                () =>
                    reject(
                        request.error
                    );
        }
    );
}

</script>

</body>
</html>
